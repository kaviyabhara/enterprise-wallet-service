spring.datasource.url=jdbc:mysql://${DB_HOST:wallet-mysql-db}:${DB_PORT:3306}/${DB_NAME:walletdb}?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Show full details in health checks
management.endpoint.health.show-details=always

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:wallet-redis}
spring.data.redis.port=${REDIS_PORT:6379}

# Actuator & Prometheus
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true